name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: docker-publish
    strategy:
      matrix:
        include:
          - service: api
            target: production-api
            latest_tag: latest
            tag_prefix: ""
          - service: queue
            target: production-queue
            latest_tag: queue-latest
            tag_prefix: queue-

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/manga-go
          tags: |
            type=raw,value=${{ matrix.latest_tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ matrix.tag_prefix }}sha-
            type=semver,pattern=${{ matrix.tag_prefix }}{{version}}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
