name: Build and Push Docker Images

# Invoked by release.yml after release-please cuts a release. Tags created with the default
# GITHUB_TOKEN do not trigger `push: tags` workflows, so this is called directly instead.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (release tag, e.g. v0.2.0)
        required: true
        type: string
      version:
        description: Semver version without the leading v (e.g. 0.2.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or SHA)
        required: true
        type: string
        default: main
      version:
        description: Version to tag the images with (e.g. 0.2.0). Does not push `latest`.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: docker-publish
    strategy:
      matrix:
        include:
          - service: api
            target: production-api
            latest_tag: latest
            tag_prefix: ""
          - service: queue
            target: production-queue
            latest_tag: queue-latest
            tag_prefix: queue-

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `version` is passed in explicitly rather than derived via type=semver: when called from
      # release.yml, github.ref is refs/heads/main, so semver would not resolve to anything.
      # `latest` is skipped on manual runs so an ad-hoc build cannot clobber the released tag.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/manga-go
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}${{ inputs.version }}
            type=raw,value=${{ matrix.latest_tag }},enable=${{ github.event_name != 'workflow_dispatch' }}
            type=sha,prefix=${{ matrix.tag_prefix }}sha-

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
